name: Daily Huddle Report

on:
  push:
    branches: [main]   # any commit (incl. your Mac's hourly board pushes) redeploys Pages
  schedule:
    # Two entries so the report always fires at 9:00 AM ET regardless of DST.
    # On DST transition days both crons fire; generate_report.py skips the duplicate.
    - cron: "0 13 * * 1-5"   # 9:00 AM EDT (clocks spring forward, UTC-4)
    - cron: "0 14 * * 1-5"   # 9:00 AM EST (clocks fall back,  UTC-5)
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

permissions:
  contents: write   # needed to commit the updated index.html
  pages: write       # needed to deploy to GitHub Pages
  id-token: write    # needed for Pages deployment auth

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Report regeneration only runs on the 9am schedule or a manual trigger --
      # NOT on every push. A `push` firing here means your Mac's hourly board
      # update (or another automated push), which just needs Pages re-deployed
      # with whatever's already in the repo -- it doesn't need a fresh report,
      # and running the commit/push steps here caused a race: this job's own
      # `git push` would get rejected if the Mac pushed again before this job
      # finished (2026-08-06, run #174 -- "failed to push some refs ... fetch
      # first"). Skipping these steps entirely on `push` events removes that
      # race and avoids needlessly regenerating the report dozens of times/day.
      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Generate report
        if: github.event_name != 'push'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python generate_report.py

      - name: Commit and push updated report
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Only commit if something changed. [skip ci] on OUR OWN commit stops
          # this push from re-triggering this same workflow (the `push` trigger
          # above) -- avoids a redundant extra run. Pushes from other sources
          # (e.g. the Mac's hourly boards/ update) have no [skip ci] in their
          # message, so they DO trigger a redeploy, which is the point.
          git diff --staged --quiet || git commit -m "📊 Daily Huddle Report — $(date +'%B %-d, %Y') [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 min — GitHub's default 10 min is what was timing out
